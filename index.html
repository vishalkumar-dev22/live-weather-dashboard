<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Live Weather Dashboard</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <!-- Header -->
        <header>
            <h1>🌤️ Live Weather Dashboard</h1>
            <p>Check real-time weather and 5-day forecast</p>
        </header>

        <!-- Search Section -->
        <section class="search-box">

            <input
                type="text"
                id="cityInput"
                placeholder="Enter city name..."
                autocomplete="off"
            >

            <button id="searchBtn">
                🔍 Search
            </button>

        </section>

        <!-- Error Message -->
        <div id="errorMessage" class="error"></div>

        <!-- Loading -->
        <div id="loading" class="loading">
            Loading weather...
        </div>

        <!-- Current Weather -->
        <section id="currentWeather" class="current-weather">

            <div class="weather-main">

                <div>
                    <h2 id="cityName">New Delhi</h2>
                    <p id="weatherDescription">Clear Sky</p>
                </div>

                <div class="weather-icon" id="weatherIcon">
                    ☀️
                </div>

            </div>

            <div class="temperature">
                <span id="temperature">--</span>°C
            </div>

            <div class="weather-details">

                <div class="detail-card">
                    <span>💧</span>
                    <p>Humidity</p>
                    <strong id="humidity">--%</strong>
                </div>

                <div class="detail-card">
                    <span>💨</span>
                    <p>Wind Speed</p>
                    <strong id="windSpeed">-- km/h</strong>
                </div>

                <div class="detail-card">
                    <span>🌡️</span>
                    <p>Feels Like</p>
                    <strong id="feelsLike">--°C</strong>
                </div>

            </div>

        </section>

        <!-- Forecast -->
        <section class="forecast-section">

            <h2>5-Day Forecast</h2>

            <div id="forecastContainer" class="forecast-container">
                <!-- Forecast cards will be inserted using JavaScript -->
            </div>

        </section>

        <!-- Footer -->
        <footer>
            <p>Weather Dashboard | Built with HTML, CSS & JavaScript</p>
        </footer>

    </div>

    <script src="script.js"></script>

</body>
</html>
